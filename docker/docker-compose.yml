services:
  valhalla:
    image: valhalla-fork:patch4-turnangles
    container_name: yurunavi-valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - /data/valhalla/custom_files:/custom_files
    command: valhalla_service /custom_files/valhalla.json 1

  tiles:
    image: maptiler/tileserver-gl:latest
    container_name: yurunavi-tiles
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /data/tiles/data:/data
      - /data/tiles/fonts:/fonts
    command: ["--config", "/data/config.json"]

  # navi.westinx.com — fun-road scoring API (native/src/main.rs).
  # network_mode: host because the binary hardcodes "http://localhost:8002"
  # to reach the valhalla service above; host networking keeps that call
  # working unchanged instead of rewriting it to service-name DNS.
  navi:
    build:
      context: ../native
      dockerfile: Dockerfile
    image: yurunavi-navi:latest
    container_name: yurunavi-navi
    restart: unless-stopped
    network_mode: host
    volumes:
      # POI SQLite DB (native/src/bin/ingest_poi.rs가 분기별로 재적재). 읽기 전용 마운트 —
      # /poi/nearby가 여는 파일이며 없어도 서버 자체는 뜬다(해당 라우트만 503).
      - /data/poi:/data/poi:ro
