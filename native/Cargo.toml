[package]
name = "yurunavi_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "yurunavi_native"
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "yurunavi_server"
path = "src/main.rs"

[[bin]]
name = "ingest_poi"
path = "src/bin/ingest_poi.rs"

[[bin]]
name = "ingest_tourism"
path = "src/bin/ingest_tourism.rs"

[[bin]]
name = "refresh_gasstations"
path = "src/bin/refresh_gasstations.rs"

[dependencies]
flutter_rust_bridge = "2"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
csv = "1.4"
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
