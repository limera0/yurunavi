name: yurunavi
description: "YuruNavi (유루나비) - 이륜차 전용 감성 내비게이션"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  geolocator: ^14.0.2
  vibration: ^3.1.8
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  sunrise_sunset_calc: ^3.0.0
  flutter_rust_bridge: ^2.12.0
  http: ^1.2.2
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4
  wakelock_plus: ^1.2.10
  permission_handler: ^11.4.0
  flutter_tts: ^4.2.0
  maplibre_gl: ^0.26.1
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  android_pip: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/voice_packs/
    - assets/config/guidance_profile.json
    - assets/data/kr_places.json
