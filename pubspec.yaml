name: yurunavi
description: "YuruNavi (유루나비) - 이륜차 전용 감성 내비게이션"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  latlong2: ^0.9.1
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  geolocator: ^14.0.2
  vibration: ^3.1.8
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  sunrise_sunset_calc: ^3.0.0
  flutter_rust_bridge: ^2.12.0
  http: ^1.2.2
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  geocoding: ^5.0.0
  share_plus: ^13.2.1
  connectivity_plus: ^6.1.4
  wakelock_plus: ^1.2.10
  permission_handler: ^11.4.0
  flutter_tts: ^4.2.0
  maplibre_gl: ^0.26.1
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  google_sign_in: ^7.2.0
  firebase_auth: ^6.5.6
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # wakelock_plus의 Pigeon 채널을 위젯 테스트에서 모킹하기 위해 직접 참조
  # (test/nav_screen_tour_finalize_test.dart) — wakelock_plus 자체는 이미
  # main 의존성으로 있고, 이건 그 플랫폼 인터페이스 패키지를 테스트에서
  # 직접 import하기 위한 depend_on_referenced_packages 린트 대응.
  wakelock_plus_platform_interface: ^1.5.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_flat.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FBF1E7"
  adaptive_icon_foreground: "assets/icon/app_icon_adaptive_fg.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/skins/
    - assets/voice_packs/
    - assets/config/guidance_profile.json
    - assets/data/kr_places.json
    - assets/data/rear_cameras.json
    - assets/images/nav_icons/

  # DSEG7 (OFL 라이선스, keshikan) — 후면단속카메라 게이지 7세그먼트 LED 숫자.
  # 출처/라이선스 원문: assets/fonts/DSEG-LICENSE.txt
  fonts:
    - family: DSEG7Classic
      fonts:
        - asset: assets/fonts/DSEG7Classic-Bold.ttf
          weight: 700
