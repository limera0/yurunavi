<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:100%; height:100vh; overflow:hidden; }
  #map { width:100%; height:100%; }
  #loading {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.7); color:#fff; padding:10px 18px;
    border-radius:6px; font:14px sans-serif; display:none;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="loading">경로 계산 중...</div>
<script>
const STYLE_OBJ = {{STYLE_OBJ}};
const ROUTES_JSON = {{ROUTES_JSON}};
const SHOW_LOADING = {{SHOW_LOADING}};

if (SHOW_LOADING) document.getElementById("loading").style.display = "block";

const map = new maplibregl.Map({
  container: "map",
  style: STYLE_OBJ,
  center: [127.05, 37.54],
  zoom: 10,
});

map.on("error", (e) => console.error("[MapLibre]", e.error));

map.on("load", () => {
  document.getElementById("loading").style.display = "none";

  if (!ROUTES_JSON || !ROUTES_JSON.features || ROUTES_JSON.features.length === 0) return;

  map.addSource("routes", {
    type: "geojson",
    data: ROUTES_JSON,
  });

  map.addLayer({
    id: "routes-line-bg",
    type: "line",
    source: "routes",
    layout: { "line-join": "round", "line-cap": "round" },
    paint: {
      "line-color": "#fff",
      "line-width": 7,
      "line-opacity": 0.6,
    },
  });

  map.addLayer({
    id: "routes-line",
    type: "line",
    source: "routes",
    layout: { "line-join": "round", "line-cap": "round" },
    paint: {
      "line-color": ["get", "color"],
      "line-width": 4,
      "line-opacity": 0.9,
    },
  });

  // fit bounds
  const coords = ROUTES_JSON.features.flatMap(f => f.geometry.coordinates);
  if (coords.length > 0) {
    const lons = coords.map(c => c[0]);
    const lats = coords.map(c => c[1]);
    const bbox = [
      [Math.min(...lons) - 0.02, Math.min(...lats) - 0.02],
      [Math.max(...lons) + 0.02, Math.max(...lats) + 0.02],
    ];
    map.fitBounds(bbox, { padding: 40, duration: 600 });
  }
});
</script>
</body>
</html>
