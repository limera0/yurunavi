<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  #map { position:absolute; top:0; left:0; right:0; bottom:0; }
  #status {
    position:absolute; bottom:8px; left:8px; z-index:10;
    background:rgba(0,0,0,0.6); color:#fff;
    padding:4px 10px; border-radius:4px; font:12px monospace;
    pointer-events:none;
  }
  #err {
    position:absolute; top:8px; left:8px; right:8px; z-index:20;
    background:#d00; color:#fff; padding:8px 12px;
    border-radius:6px; font:13px sans-serif; display:none; word-break:break-all;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="status">초기화 중...</div>
<div id="err"></div>
<script>
const STYLE_OBJ  = {{STYLE_OBJ}};
const ROUTES_JSON = {{ROUTES_JSON}};
const SHOW_LOADING = {{SHOW_LOADING}};

const statusEl = document.getElementById("status");
const errEl    = document.getElementById("err");

function showErr(msg) {
  errEl.textContent = "MapLibre 오류: " + msg;
  errEl.style.display = "block";
  statusEl.textContent = "오류 발생";
}

window.onerror = function(msg, src, line) {
  showErr(msg + " (" + src + ":" + line + ")");
};

let map;
try {
  map = new maplibregl.Map({
    container: "map",
    style: STYLE_OBJ,
    center: [127.05, 37.54],
    zoom: 10,
    attributionControl: false,
  });
} catch(e) {
  showErr("Map 생성 실패: " + e.message);
}

if (map) {
  map.on("error", function(e) {
    var msg = (e.error && e.error.message) ? e.error.message : JSON.stringify(e);
    showErr(msg);
    console.error("[MapLibre]", e);
  });

  map.on("load", function() {
    statusEl.textContent = "지도 로드 완료";
    map.resize();

    if (!ROUTES_JSON || !ROUTES_JSON.features || ROUTES_JSON.features.length === 0) return;

    map.addSource("routes", { type: "geojson", data: ROUTES_JSON });

    map.addLayer({
      id: "routes-line-bg",
      type: "line",
      source: "routes",
      layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": "#fff", "line-width": 7, "line-opacity": 0.6 },
    });

    map.addLayer({
      id: "routes-line",
      type: "line",
      source: "routes",
      layout: { "line-join": "round", "line-cap": "round" },
      paint: {
        "line-color": ["get", "color"],
        "line-width": 4,
        "line-opacity": 0.9,
      },
    });

    var coords = ROUTES_JSON.features.flatMap(function(f) { return f.geometry.coordinates; });
    if (coords.length > 0) {
      var lons = coords.map(function(c){ return c[0]; });
      var lats = coords.map(function(c){ return c[1]; });
      map.fitBounds(
        [[Math.min.apply(null,lons)-0.02, Math.min.apply(null,lats)-0.02],
         [Math.max.apply(null,lons)+0.02, Math.max.apply(null,lats)+0.02]],
        { padding: 40, duration: 600 }
      );
    }
  });

  // iframe가 나중에 리사이즈 됐을 때 대응
  window.addEventListener("resize", function() { map.resize(); });
}
</script>
</body>
</html>
